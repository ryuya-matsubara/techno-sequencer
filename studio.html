<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.jpeg">
  <link rel="icon" href="./icon.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="./studio.css">
  <title>Song Studio · Techno Sequencer</title>
</head>
<body>
<main class="studio">
  <header class="topbar">
    <div class="brand">
      <a class="back" href="./" aria-label="楽曲一覧に戻る">‹</a>
      <div class="name">
        <span class="eyebrow">TECHNO SEQUENCER</span>
        <button id="renameSong" class="song-name" title="曲名を変更">Untitled Song <span>✎</span></button>
      </div>
      <button id="saveBtn" class="accent" type="button">Save</button>
    </div>
    <div class="transport">
      <button id="playBtn" class="accent" type="button">▶ Play</button>
      <button id="stopBtn" type="button">■ Stop</button>
      <label class="bpm-label">BPM <input id="bpm" type="number" min="60" max="200" step="1" inputmode="numeric" value="140"></label>
      <div class="play-position" id="position">1 / 32</div>
    </div>
  </header>
  <nav class="tabs" aria-label="エディタの切り替え">
    <button data-tab="song" class="selected" type="button">SONG</button>
    <button data-tab="pattern" type="button">PATTERN</button>
    <button data-tab="mixer" type="button">MIXER</button>
    <button data-tab="sound" type="button">SOUND</button>
  </nav>
  <section id="songPanel" class="panel">
    <div class="section-head">
      <div><h2>Arrangement</h2><p>空いている場所をタップしてクリップ追加 · タップして音符を編集 · 長押しで操作</p></div>
    </div>
    <div class="section-tools">
      <label>Song length
        <select id="songBars">
          <option value="16">16 bars</option>
          <option value="32">32 bars</option>
          <option value="64">64 bars</option>
          <option value="128">128 bars</option>
        </select>
      </label>
      <button id="starterBtn" type="button">＋ Starter Beat</button>
    </div>
    <div class="timeline-wrap" id="timelineWrap" tabindex="0" aria-label="曲の時間軸">
      <div id="timeline" class="timeline"></div>
    </div>
    <p class="hint">横スクロールで曲を移動できます。クリップは1小節単位で配置されます。</p>
  </section>
  <section id="patternPanel" class="panel" hidden>
    <div class="section-head">
      <div><h2 id="patternTitle">Pattern Editor</h2><p id="patternSub">クリップを選択すると編集できます。</p></div>
      <button id="backToSong" type="button">← Song</button>
    </div>
    <div id="patternControls" class="section-tools">
      <label>Pattern length
        <select id="patternBars">
          <option value="1">1 bar</option><option value="2">2 bars</option><option value="4">4 bars</option>
        </select>
      </label>
      <label id="noteLengthLabel">Note length
        <select id="noteLength">
          <option value="1">1/16</option><option value="2">1/8</option><option value="4">1/4</option>
          <option value="8">1/2</option><option value="16">1 bar</option>
        </select>
      </label>
      <button id="clearPattern" type="button">Clear Notes</button>
    </div>
    <div id="patternGrid" class="pattern-workspace"></div>
    <p class="hint" id="patternHint">マスをタップすると音を配置・削除できます。</p>
  </section>
  <section id="mixerPanel" class="panel" hidden>
    <div class="section-head"><div><h2>Mixer</h2><p>楽器ごとの音量とミュートを調整します。</p></div></div>
    <div id="mixerRows" class="settings-list"></div>
  </section>
  <section id="soundPanel" class="panel" hidden>
    <div class="section-head"><div><h2>Sound</h2><p>プリセットを選んで、3つの項目で音を調整します。</p></div></div>
    <label class="sound-track-picker">Track <select id="soundTrack"></select></label>
    <div id="soundEditor" class="sound-editor"></div>
  </section>
  <footer class="status"><span id="status" role="status">Ready</span><span>Auto-saved on this device</span></footer>
</main>
<dialog id="clipMenu" class="action-dialog">
  <div class="dialog-body">
    <div class="dialog-top"><h3 id="clipMenuTitle">Clip</h3><button id="closeMenu" type="button" aria-label="閉じる">×</button></div>
    <button id="menuEdit" type="button">✎ Edit Notes</button>
    <button id="menuDuplicate" type="button">▣ Duplicate (independent)</button>
    <label class="inline-select">Clip length
      <select id="menuLength">
        <option value="1">1 bar</option><option value="2">2 bars</option><option value="4">4 bars</option>
        <option value="8">8 bars</option><option value="16">16 bars</option><option value="32">32 bars</option>
      </select>
    </label>
    <div class="move-row">
      <button id="moveLeft" type="button">← 1 bar</button><button id="moveRight" type="button">1 bar →</button>
    </div>
    <button id="menuDelete" class="danger" type="button">Delete Clip</button>
  </div>
</dialog>
<script src="./song-data.js"></script>
<script src="./studio-audio.js"></script>
<script src="./studio.js"></script>
</body>
</html>
