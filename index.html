<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Techno Seq" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon.jpeg" />
  <link rel="icon" href="./icon.jpeg" type="image/jpeg" />
  <link rel="stylesheet" href="./home.css" />
  <title>Techno Sequencer</title>
</head>
<body>
  <main class="home-shell">
    <header class="home-head">
      <div>
        <p class="eyebrow">TECHNO SEQUENCER</p>
        <h1>Patterns</h1>
        <p class="subtitle">Choose a saved pattern or start a new one.</p>
      </div>
      <button id="newPatternBtn" class="new-button" type="button">＋ New Pattern</button>
    </header>

    <section class="library" aria-labelledby="libraryTitle">
      <div class="library-head">
        <h2 id="libraryTitle">Saved Patterns</h2>
        <span id="savedCount" class="count">0</span>
      </div>
      <div id="patternList" class="pattern-list"></div>
      <div id="emptyState" class="empty-state" hidden>
        <p>No saved patterns yet.</p>
        <button id="emptyNewBtn" type="button">Create your first pattern</button>
      </div>
    </section>
  </main>
  <script src="./home.js"></script>
</body>
</html>
